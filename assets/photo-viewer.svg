  <rect x="82" y="80" width="24" height="26" rx="6" fill="#2a2a30" stroke="#90959f" stroke-opacity="0.35"/>
  <!-- favorite star -->
  <path d="M34 85.5 l2.35 4.76 5.25 .76 -3.8 3.7 .9 5.23 -4.7 -2.47 -4.7 2.47 .9 -5.23 -3.8 -3.7 5.25 -.76 Z" fill="#ffd166"/>
  <circle cx="90" cy="93" r="2" fill="#90959f" opacity="0.7"/><circle cx="94" cy="93" r="2" fill="#90959f" opacity="0.7"/><circle cx="98" cy="93" r="2" fill="#90959f" opacity="0.7"/>
