    <rect x="22" y="22" width="52" height="52" fill="url(#sky)"/>
    <circle cx="58" cy="37" r="6.5" fill="#ffe7a3"/>
    <path d="M22 74 L41 47 L52 61 L59 53 L74 74 Z" fill="#2a4f86"/>
    <path d="M22 74 L41 47 L47 55 L36 74 Z" fill="#3a5588" opacity="0.8"/>
  </g>

